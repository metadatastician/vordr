# SPDX-License-Identifier: MPL-2.0
# Calls the estate's shared secret scanner (gitleaks + rust-secrets +
# shell-secrets). Added because this repository had NO leak scanning at all.
#
# The reusable declares no workflow-call secrets. Do not use `secrets: inherit`:
# the scanner needs only its explicitly read-only GITHUB_TOKEN permissions.
name: "Secret Scanner"
on:
  pull_request:
  push:
    branches: [main, master]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  scan:
    # The previous a3308ea pin's actions.lock became invalid at runner setup,
    # preventing all three scanners from starting. This standards commit has a
    # regenerated lockfile and a successfully exercised reusable scanner.
    uses: metadatastician/standards/.github/workflows/secret-scanner-reusable.yml@b8f60511e76c9015d86990317162dce653c92fe1
