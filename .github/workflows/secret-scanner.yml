# SPDX-License-Identifier: MPL-2.0
# Calls the estate's shared secret scanner (gitleaks + rust-secrets +
# shell-secrets). Added because this repository had NO leak scanning at all.
#
# Keep `secrets: inherit` so the reusable scanner can receive any credentials
# it explicitly declares without widening this wrapper's permissions.
name: "Secret Scanner"
on:
  pull_request:
  push:
    branches: [main, master]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  scan:
    # The previous a3308ea pin's actions.lock became invalid at runner setup,
    # preventing all three scanners from starting. This standards commit has a
    # regenerated lockfile and a successfully exercised reusable scanner.
    uses: hyperpolymath/standards/.github/workflows/secret-scanner-reusable.yml@8ff9ce65f7e54f8d5c5aa94584e2ead0f2ba460f
    secrets: inherit
